# Render Blueprint for Agent Tab (https://render.com/docs/blueprint-spec)
# Deploy: New + > Blueprint > point at this repo. Set the sync:false env vars in the dashboard.
services:
  - type: web
    name: agent-tab-service
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/tab-service/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TAB_SERVICE_PORT
        value: "10000"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_TAB_MODEL
        value: claude-sonnet-5-5
      - key: RECEIPT_PRIVATE_KEY_JWK
        sync: false
      - key: RECEIPT_PUBLIC_KEY_JWK
        sync: false

  - type: web
    name: agent-tab-paid-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/paid-data-api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PAID_API_PORT
        value: "10000"
      - key: PAID_API_MERCHANT_ID
        value: research-data-demo
      - key: TAB_SERVICE_URL
        fromService:
          type: web
          name: agent-tab-service
          property: host

  - type: web
    name: agent-tab-ledger
    runtime: static
    buildCommand: npm ci && npm run build:ledger
    staticPublishPath: apps/ledger/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_TAB_SERVICE_URL
        fromService:
          type: web
          name: agent-tab-service
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
