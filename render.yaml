# Render Blueprint for Agent Tab (https://render.com/docs/blueprint-spec)
# Deploy: New + > Blueprint > point at this repo. Set the sync:false env vars in the dashboard.
services:
  - type: web
    name: agent-tab-service
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/tab-service/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TAB_SERVICE_PORT
        value: "10000"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_TAB_MODEL
        value: claude-sonnet-5-5
      - key: RECEIPT_PRIVATE_KEY_JWK
        sync: false
      - key: RECEIPT_PUBLIC_KEY_JWK
        sync: false
      # Comma-separated PayPal vault ids this deployment may charge (output of spike:token).
      - key: VAULT_IDS
        sync: false

  - type: web
    name: agent-tab-paid-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/paid-data-api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAID_API_PORT
        value: "10000"
      - key: PAID_API_MERCHANT_ID
        value: research-data-demo
      # Public URL on purpose: fromService "host" gives the internal hostname, which the
      # free plan cannot reach. Change this if your tab service has a different onrender.com URL.
      - key: TAB_SERVICE_URL
        value: https://agent-tab-service.onrender.com

  - type: web
    name: agent-tab-ledger
    runtime: static
    buildCommand: npm ci && npm run build:ledger
    staticPublishPath: apps/ledger/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the browser bundle, so it must be the public URL, not an internal hostname.
      - key: VITE_TAB_SERVICE_URL
        value: https://agent-tab-service.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
